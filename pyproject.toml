[project]
name = "geoparquet-mcp"
version = "0.1.0"
description = "MCP server for spatial analysis over remote GeoParquet files, read in place by DuckDB."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Raimana Teina" }]
keywords = ["mcp", "geoparquet", "duckdb", "geospatial", "parquet", "spatial-sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "duckdb>=1.5",
    "mcp>=2.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/rteina/geoparquet-mcp"
Repository = "https://github.com/rteina/geoparquet-mcp"
Issues = "https://github.com/rteina/geoparquet-mcp/issues"

[project.scripts]
geoparquet-mcp = "geoparquet_mcp.cli:main"
geoparquet-mcp-server = "geoparquet_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoparquet_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test that reads the remote dataset over HTTP"]
asyncio_mode = "auto"
